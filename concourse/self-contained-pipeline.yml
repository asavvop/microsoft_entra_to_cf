---
jobs:
  - name: deploy-to-tas
    plan:
      - task: cf-push
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: governmentpaas/cf-cli
              tag: latest
          params:
            CF_API: https://api.sys.example.com
            CF_ORG: sample-org
            CF_SPACE: dev-space
            CF_CLIENT_ID: ((cf_client_id))
            CF_CLIENT_SECRET: ((cf_client_secret))
          run:
            path: sh
            args:
              - -exc
              - |
                echo "Targeting CF API..."
                cf api $CF_API --skip-ssl-validation
                
                echo "Authenticating via OAuth2 Client Credentials..."
                cf auth $CF_CLIENT_ID $CF_CLIENT_SECRET --client-credentials
                
                echo "Targeting Org and Space..."
                cf target -o $CF_ORG -s $CF_SPACE
                
                echo "Creating web application payload..."
                mkdir -p ./app
                echo "<h1>Hello from Concourse CI on Tanzu Platform!</h1><p>Deployed via OAuth2 Client Credentials without SAML.</p>" > ./app/index.html
                touch ./app/Staticfile
                
                echo "Pushing application..."
                cd ./app
                cf push concourse-demo-app -b staticfile_buildpack -m 64M -k 128M --random-route
                
                echo "Deployment complete!"
                cf apps
